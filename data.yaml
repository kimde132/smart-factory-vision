# ─────────────────────────────────────────────────────────────────────────────
# 이 파일은 무엇을 하는가
#   YOLO에게 주는 "주소록"이다. 학습 데이터가 어디 있고, 클래스가 몇 개이며,
#   각 번호가 무슨 부품인지를 적는다.
#   학습 명령에 넘기는 것은 사진 폴더가 아니라 이 파일 하나다.
#     예) model.train(data="data.yaml", ...)
#   이 파일에 적히지 않은 폴더는 YOLO가 존재조차 모른다.
#
# 프로젝트 실행 흐름에서 어느 위치인가
#   촬영 → 라벨링 → verify_counts.py → split_dataset.py → [현재 파일] → 학습 스크립트
#
#   앞: split_dataset.py 가 dataset/result_data/{images,labels}/{train,val,test} 를 채워야 한다
#       (세션 → split 배정표는 그 스크립트의 SPLIT_OF_SESSION 이 원본이고, 여기 아래 설명은 사본이다)
#   뒤: 학습 스크립트(#17)가 이 파일 경로를 인자로 받아 Colab에서 학습을 돌린다
#
# 이 파일을 이해하기 전에 알아야 할 개념
#   YAML : 설정을 적는 형식. "키: 값" 으로 쓰고, 들여쓰기(공백)로 계층을 표현한다.
#          탭 문자는 쓸 수 없다. 반드시 스페이스로 들여쓴다.
#          '#' 뒤는 주석이라 YOLO가 읽지 않는다.
#
#   ★ labels 폴더를 적는 칸이 없는 이유
#     아래에 images 폴더만 적고 labels 폴더는 어디에도 적지 않는다. 빠뜨린 게 아니다.
#     YOLO는 이미지 경로 문자열에서 "images" 를 "labels" 로 바꿔치기해서 라벨을 찾는다.
#       .../result_data/images/train/s01_001.jpg
#       .../result_data/labels/train/s01_001.txt   ← 이렇게 스스로 만들어낸다
#     그래서 두 폴더 이름은 images / labels 여야 하고, 파일명은 확장자만 빼고 같아야 한다.
#     이 규칙이 깨지면 에러가 나지 않고 "라벨 0개"로 조용히 학습한다. 가장 찾기 어려운 사고다.
#
#   ★ 클래스 번호의 원본은 이 파일이 아니다
#     원본은 docs/labeling-guide.md 1-1 표다. 여기는 사본이다.
#     Label Studio에 등록된 순서가 곧 번호이고, 라벨 .txt 첫 칸의 숫자가 그 번호다.
#     여기 순서를 바꾸면 이미 그려둔 라벨 전체가 다른 부품을 가리키게 된다.
#
# 관련 문서:
#   docs/labeling-guide.md 1-1 (클래스 순서 원본)
#   docs/decisions.md D-003 (Train/Val/Test 분할 기준), D-004 (검사 대상 3종)
#   docs/decisions.md D-011 (6세션 배정: Train 4 / Val 1 / Test 1), scripts/split_dataset.py (배정표 원본)
# ─────────────────────────────────────────────────────────────────────────────


# ─── 1. 데이터셋 뿌리 경로 ────────────────────────────────────────────────────
# 아래 train/val 경로가 붙을 기준점이다. 여기서부터 이어붙여 최종 경로가 만들어진다.
#   path + train = 실제로 사진을 찾아갈 폴더
#
# 학습은 Colab에서 돌리고(D-002), 데이터는 Google Drive에 올린다.
# Colab에서 Drive를 마운트하면 내 드라이브가 /content/drive/MyDrive 로 붙는다.
# 그래서 이 값은 노트북이 아니라 "Colab 안에서 보이는 경로"여야 한다.
#
# TODO: Drive에 result_data 를 올린 뒤, Colab에서 보이는 절대경로로 채운다.
#       올릴 폴더 이름을 먼저 정해야 이 줄을 쓸 수 있다.
#       예) /content/drive/MyDrive/smart-factory-vision/result_data
#       확인 방법 — Colab에서 마운트 후 !ls <경로> 를 찍어 폴더가 보이면 맞는 경로다.
path: /content/drive/MyDrive/smart-factory-vision/result_data

# ─── 2. 학습 / 검증에 쓸 이미지 폴더 ──────────────────────────────────────────
# 위 path 를 기준으로 한 상대경로다. 앞에 / 를 붙이면 절대경로가 되어 path가 무시된다.
#
# 세션 단위 분할(D-003). 한 세션은 통째로 한 폴더에만 들어간다. 랜덤으로 섞지 않는다.
#
# train : 모델이 보고 배우는 사진. 140장
#           s01 아이폰·손 촬영·23.2cm    s02 웹캠·천장등+스탠드
#           s03 웹캠·천장등+스탠드(강)   s06 아이폰·조명 없음(indirect)
# val   : 학습 중 채점만 하는 사진. 모델은 이것으로 배우지 않는다. 35장
#           s04 웹캠·스탠드(약)만. train 어디에도 없는 조명 조건이다
#
# 9/6 첫 학습(s01 하나를 28/7로 나눔)과 달리 이번엔 train과 val이 다른 세션이라
# val 점수가 "본 적 없는 조건에서 얼마나 맞히는가"를 말한다. 첫 정식 실험이다.
train: images/train
val: images/val

# test : 최종 시험지. 딱 한 번만 쓴다. 35장
#          s05 웹캠·천장등+스탠드(측면). val(s04)과는 천장등 유무가 다르다
#        학습 중에는 쓰이지 않는다. 학습이 끝난 뒤 model.val(split="test") 로 한 번 채점하고,
#        그 결과로 실패 분석(#21)을 한다. test 결과를 보고 설정을 바꾸면 test 가 val 이 되어버린다.
test: images/test

# ─── 3. 클래스 ────────────────────────────────────────────────────────────────
# 왼쪽 숫자가 라벨 .txt 첫 칸에 적히는 클래스 번호다.
#   예) "1 0.19718 0.41126 0.08506 0.07963" → 앞의 1 이 여기 1번을 가리킨다
# 오른쪽 이름은 학습 로그와 탐지 결과 화면에 그대로 표시된다.
#
# 이름을 영문으로 쓰는 이유 (labeling-guide.md 1-1)
#   한글은 인코딩이 어긋나면 글자가 깨지고, YOLO의 결과 표시가 한글 폰트를 지원하지 않는다.
#
# TODO: docs/labeling-guide.md 1-1 표를 보고 세 줄의 이름을 옮겨 적는다.
#       번호는 그 표의 번호를 그대로 쓴다. 외워서 쓰지 말고 표를 열어 보고 쓴다.
#       (nc: 항목은 적지 않는다. 최근 ultralytics는 names의 개수로 클래스 수를 알아낸다)
names:
  0: bolt
  1: nut
  2: washer
