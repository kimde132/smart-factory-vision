# ╔══════════════════════════════════════════════════════════════════════════════════════════╗
# ║  data.yaml — YOLO 에게 주는 "주소록". 학습 데이터가 어디 있고, 클래스가 몇 개이며, 각 번호가 무슨 부품인지    ║
# ╚══════════════════════════════════════════════════════════════════════════════════════════╝
#
# ┌ 0. 이 파일은 무엇이고 언제 읽히나 ─────────────────────────────────────────────────────────
# │
# │  학습 명령에 넘기는 것은 사진 폴더가 아니라 이 파일 하나다.  model.train(data="…/data.yaml", …)  (scripts/train.py)
# │  이 파일에 적히지 않은 폴더는 YOLO 가 존재조차 모른다.
# │
# │  촬영 → 라벨링 → verify_counts.py → split_dataset.py → [현재 파일] → train.py(Colab)
# │  앞: split_dataset.py 가 dataset/result_data/{images,labels}/{train,val,test} 를 채워야 한다
# │      (세션 → split 배정표는 그 스크립트의 SPLIT_OF_SESSION 이 원본이고, 여기 아래 설명은 사본이다)
# │  뒤: train.py 가 이 파일 경로를 인자로 받아 Colab 에서 학습을 돌린다. 여기 names 가 학습된 모델의 result.names 가 되어 main.py 까지 간다.
# │
# │  이 파일은 프로젝트 최상위에 둔다. dataset/ 은 .gitignore 대상이라 그 안에 넣으면 git 에 안 남는다.
# │
# ├ 1. 이름은 세 종류 (YAML 판) ────────────────────────────────────────────────────────
# │
# │  ① YAML 문법          : "키: 값"  들여쓰기(공백 2칸)로 계층  # 뒤는 주석
# │  ② YOLO 가 정한 키     : path  train  val  test  names   ← ultralytics 가 이 이름으로 읽는다. 바꾸면 못 찾는다
# │                          images / labels 폴더 이름       ← YOLO 규칙 (아래 설명)
# │  ③ 내가 정한 값        : 경로 글자, 클래스 이름 bolt/nut/washer (원본은 labeling-guide.md 1-1)
# │
# ├ 2. 알아야 할 개념 ───────────────────────────────────────────────────────────────────
# │
# │  YAML : 설정을 적는 형식. 탭 문자는 쓸 수 없다. 반드시 스페이스로 들여쓴다. Python 딕셔너리로 읽으면 {"path": "…", "train": "…", "names": {0: "bolt", …}} 가 된다.
# │
# │  ★ labels 폴더를 적는 칸이 없는 이유
# │    아래에 images 폴더만 적고 labels 폴더는 어디에도 적지 않는다. 빠뜨린 게 아니다.
# │    YOLO 는 이미지 경로 문자열에서 "images" 를 "labels" 로 바꿔치기해서 라벨을 찾는다.
# │      .../result_data/images/train/s01_001.jpg
# │      .../result_data/labels/train/s01_001.txt   ← 이렇게 스스로 만들어낸다
# │    그래서 두 폴더 이름은 images / labels 여야 하고, 파일명은 확장자만 빼고 같아야 한다(split_dataset.py 가 그렇게 만든다).
# │    이 규칙이 깨지면 에러가 나지 않고 "라벨 0개" 로 조용히 학습한다. 가장 찾기 어려운 사고다.
# │
# │  ★ 클래스 번호의 원본은 이 파일이 아니다
# │    원본은 docs/labeling-guide.md 1-1 표다. 여기는 사본이다. Label Studio 에 등록된 순서가 곧 번호이고, 라벨 .txt 첫 칸의 숫자가 그 번호다.
# │    여기 순서를 바꾸면 이미 그려둔 라벨 전체가 다른 부품을 가리키게 된다. verify_counts.py 의 CLASS_NAMES, predict_count.py 의 CLASS_NAMES 도 같은 사본.
# │
# │  관련 문서: docs/labeling-guide.md 1-1 (클래스 순서 원본), docs/decisions.md D-003 (분할 기준), D-004 (검사 대상 3종), D-011 (세션 배정),
# │            scripts/split_dataset.py (배정표 원본 SPLIT_OF_SESSION)
# └────────────────────────────────────────────────────────────────────────────────────────


# ─── 1. 데이터셋 뿌리 경로 ────────────────────────────────────────────────────────────────
# ▸ 단어 분해: path(② YOLO 키): /content/drive/MyDrive/smart-factory-vision/result_data(③ Colab 안에서 보이는 절대 경로)
# ▸ 뜻: 아래 train/val/test 경로가 붙을 기준점. path + train = 실제로 사진을 찾아갈 폴더.
# ▸ 왜 Colab 경로: 학습은 Colab 에서 돌리고(D-002), 데이터는 Google Drive 에 올린다. Colab 에서 Drive 를 마운트하면 내 드라이브가 /content/drive/MyDrive 로 붙는다.
#   그래서 이 값은 노트북(C:\…)이 아니라 "Colab 안에서 보이는 경로" 여야 한다. 확인 방법 — Colab 에서 마운트 후 !ls <경로> 를 찍어 폴더가 보이면 맞는 경로.
# ▸ 다른 선택: 노트북에서 스모크 테스트를 하려면 이 줄만 dataset/result_data 로 바꾸면 된다(train.py 는 Colab 전용이라 실제로 그럴 일은 없었다).
path: /content/drive/MyDrive/smart-factory-vision/result_data

# ─── 2. 학습 / 검증에 쓸 이미지 폴더 ──────────────────────────────────────────────────────
# ▸ 단어 분해: train(② 키): images/train(③ path 기준 상대 경로)
# ▸ 위 path 를 기준으로 한 상대경로. 앞에 / 를 붙이면 절대경로가 되어 path 가 무시된다.
# ▸ 세션 단위 분할(D-003). 한 세션은 통째로 한 폴더에만 들어간다. 랜덤으로 섞지 않는다. 배정표 원본은 split_dataset.py 의 SPLIT_OF_SESSION.
#
#   train : 모델이 보고 배우는 사진. 215장 (EXP-03 기준. EXP-01 140장 → EXP-02 180장 → EXP-03 215장)
#             s01 아이폰·손 촬영·23.2cm    s02 웹캠·천장등+스탠드      s03 웹캠·천장등+스탠드(강)
#             s06 아이폰·조명 없음(indirect) s07 웹캠·그림자 전용 40장(EXP-02 추가)   s08 웹캠·겹침·가장자리 35장(EXP-03 추가)
#   val   : 학습 중 채점만 하는 사진. 모델은 이것으로 배우지 않는다. 35장
#             s04 웹캠·스탠드(약)만. EXP-01 때는 train 어디에도 없는 조명 조건이었다. s07 을 넣은 뒤로는 같은 조명이 train 에 있어 점수가 후해졌다(EXP-02 4절).
train: images/train
val: images/val

# ▸ test(② 키): images/test — 최종 시험지. 학습 중에는 쓰이지 않는다. 70장 (s05 35 + s09 35)
#   s05 웹캠·천장등+스탠드(측면) — EXP-01 에서 한 번 썼다(97.1%). 이후 모델은 s05 로 채점하지 않는다.
#   s09 웹캠·스탠드 측면만, 배치 4종 — 최종 모델(EXP-03)로 딱 한 번 채점했다(32/35 = 91.4%). 다시 재지 않는다(상태판 "s09 는 다시 채점하지 않는다").
#   같은 test 폴더에 둘이 있지만 채점은 predict_count.py 로 파일 이름(s09_)을 골라 했다. test 결과를 보고 설정을 바꾸면 test 가 val 이 되어버린다.
test: images/test

# ─── 3. 클래스 ──────────────────────────────────────────────────────────────────────────
# ▸ 단어 분해: names(② 키): 아래 들여쓴 줄들 = { 번호(③): 이름(③) } 딕셔너리
# ▸ 왼쪽 숫자가 라벨 .txt 첫 칸에 적히는 클래스 번호. 예) "1 0.19718 0.41126 0.08506 0.07963" → 앞의 1 이 여기 1번(nut)을 가리킨다.
# ▸ 오른쪽 이름은 학습 로그·탐지 결과 화면·result.names 에 그대로 표시된다. main.py 의 count_boxes 가 이 이름으로 개수를 센다.
# ▸ 왜 영문: 한글은 인코딩이 어긋나면 글자가 깨지고, YOLO 의 결과 표시가 한글 폰트를 지원하지 않는다 (labeling-guide.md 1-1).
# ▸ nc:(클래스 수) 항목은 적지 않는다. 최근 ultralytics 는 names 의 개수로 클래스 수를 알아낸다. 옛 예제에는 nc: 3 이 있다.
names:
  0: bolt
  1: nut
  2: washer
